# SPDX-License-Identifier: AGPL-3.0-only
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (history and tree)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --no-banner --exit-code 7
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest dir /repo --redact --no-banner --exit-code 7

  verify:
    name: lint, typecheck, unit, integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ourstream_admin
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ourstream
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ourstream_admin -d ourstream"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgres://ourstream_admin:ci-only@localhost:5432/ourstream
      DATABASE_URL: postgres://ourstream_app:ci-app-only@localhost:5432/ourstream
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: bootstrap database roles
        run: |
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE ourstream_app LOGIN PASSWORD 'ci-app-only' NOBYPASSRLS; CREATE ROLE ourstream_platform LOGIN PASSWORD 'ci-platform-only' NOBYPASSRLS; GRANT CONNECT ON DATABASE ourstream TO ourstream_app, ourstream_platform;"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - name: license, header and Dockerfile gates
        run: pnpm licenses:check && pnpm headers:check && pnpm dockerfiles:check

  helm:
    name: infra (helm lint, template, kubeconform, invariants; compose invariants)
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v4.3.1
      HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@v4
      - name: install pinned helm and kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" && cd "$(mktemp -d)"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm-${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz" && mv linux-amd64/helm "$HOME/.local/bin/helm"
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz && mv kubeconform "$HOME/.local/bin/kubeconform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 -c 'import yaml' || sudo apt-get install -y --no-install-recommends python3-yaml
      - name: chart checks (infra/helm/our-stream/ci/check.sh)
        run: bash infra/helm/our-stream/ci/check.sh
      - name: compose trust-chain invariants (infra/docker/check-compose.py)
        run: |
          docker compose -f infra/docker/docker-compose.yml config > /tmp/compose-rendered.yaml
          python3 infra/docker/check-compose.py /tmp/compose-rendered.yaml
