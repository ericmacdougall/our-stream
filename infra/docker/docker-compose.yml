# SPDX-License-Identifier: AGPL-3.0-only
# Development and evaluation stack. Not hardened for production; see infra/helm for Kubernetes.
# Usage: docker compose -f infra/docker/docker-compose.yml up
# Browsers talk to one origin: the `edge` reverse proxy (Caddy) on 127.0.0.1:${WEB_PORT}. It sends /api and
# /media to the api and everything else to web. The edge and api bind to 127.0.0.1 by default; set
# BIND_ADDR=0.0.0.0 to expose them. Postgres, S3 and the mail catcher always stay on loopback because the
# evaluation stack uses default credentials.
# Trust chain for client addresses (docs/deployment.md "Trust chain"): the edge discards a client-supplied
# X-Forwarded-For and sets it to the TCP peer; the api trusts exactly one address, the edge's static
# EDGE_ADDRESS on the `edge` network. Nothing else (web, the Docker gateway, another container) is trusted.
# Run two copies of this stack on one host with different EDGE_SUBNET/EDGE_ADDRESS values.
name: our-stream

x-edge-subnet: &edge-subnet ${EDGE_SUBNET:-10.228.0.0/24}
x-edge-gateway: &edge-gateway ${EDGE_GATEWAY:-10.228.0.1}
x-edge-ip-range: &edge-ip-range ${EDGE_IP_RANGE:-10.228.0.0/25}
x-edge-address: &edge-address ${EDGE_ADDRESS:-10.228.0.254}

x-app-env: &app-env
  NODE_ENV: development
  DATABASE_URL: postgres://ourstream_app:${APP_DB_PASSWORD:-ourstream-app-dev-only}@postgres:5432/ourstream
  DATABASE_PLATFORM_URL: postgres://ourstream_platform:${PLATFORM_DB_PASSWORD:-ourstream-platform-dev-only}@postgres:5432/ourstream
  S3_ENDPOINT: http://storage:8333
  S3_REGION: us-east-1
  S3_BUCKET: ourstream
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ourstream-dev}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-ourstream-dev-secret-only}
  S3_FORCE_PATH_STYLE: 'true'
  SMTP_URL: smtp://mailcatcher:1025
  APP_BASE_URL: http://localhost:${WEB_PORT:-3000}
  API_BASE_URL: http://localhost:${API_PORT:-4000}
  SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789}
  MEDIA_HMAC_SECRET: ${MEDIA_HMAC_SECRET:-dev-only-media-secret-change-me-0123456789}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ourstream_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ourstream-dev-only}
      POSTGRES_DB: ourstream
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-ourstream-app-dev-only}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-ourstream-platform-dev-only}
    command:
      [
        'postgres',
        '-c',
        'shared_preload_libraries=pg_stat_statements',
        '-c',
        'log_min_duration_statement=500',
      ]
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    networks: [backend]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ourstream_admin -d ourstream']
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    # SeaweedFS all-in-one with the S3 gateway (Apache-2.0). MinIO community was archived 2026-04.
    image: chrislusf/seaweedfs:3.97
    command:
      [
        'server',
        '-s3',
        '-s3.port=8333',
        '-dir=/data',
        '-master.volumeSizeLimitMB=1024',
        '-s3.config=/etc/seaweedfs/s3.json',
      ]
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333'
    networks: [backend]
    volumes:
      - storage-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # BusyBox wget exits 1 on any HTTP error, so key on the status line: the S3 root answers 403 to anonymous requests.
      test:
        ['CMD-SHELL', 'wget -S -q -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q "HTTP/1.1 "']
      interval: 5s
      timeout: 3s
      retries: 30

  mailcatcher:
    # Local SMTP sink so magic links and invites work without real SMTP (risk R34).
    image: axllent/mailpit:v1.28
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
    networks: [backend]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ['node', 'dist/cli.js', 'migrate']
    environment:
      <<: *app-env
      DATABASE_ADMIN_URL: postgres://ourstream_admin:${POSTGRES_PASSWORD:-ourstream-dev-only}@postgres:5432/ourstream
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      <<: *app-env
      PORT: '4000'
      # Exactly one trusted hop: the edge. Never `true`, never a range that includes web or the Docker
      # gateway (docs/deployment.md "Trust chain").
      TRUST_PROXY: ${EDGE_ADDRESS:-10.228.0.254}/32
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${API_PORT:-4000}:4000'
    networks: [edge, backend]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    healthcheck:
      # The slim Node image has no wget or curl; probe with Node's fetch.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      <<: *app-env
      # ASR provider (ADR-0008): `fake` needs nothing; `whisper-http` talks to the optional `whisper`
      # profile service below (`docker compose --profile whisper up`, see docs/development.md).
      ASR_PROVIDER: ${ASR_PROVIDER:-fake}
      WHISPER_URL: http://whisper:8080
      FFMPEG_THREADS: ${FFMPEG_THREADS:-4}
      MEDIA_MAX_INPUT_BYTES: ${MEDIA_MAX_INPUT_BYTES:-4294967296}
    networks: [backend]
    read_only: true
    # Media scratch space (WORKER_TMP_DIR) and ffmpeg's temp files live in memory-backed mounts; bind a
    # volume at /var/tmp/ourstream instead when inputs approach MEDIA_MAX_INPUT_BYTES.
    tmpfs: [/tmp, /var/tmp/ourstream]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy

  whisper:
    # Self-hosted ASR sidecar (MIT, ggml-org/whisper.cpp). Only started with `--profile whisper`.
    # Download a ggml model once into the volume before the first start:
    #   docker compose -f infra/docker/docker-compose.yml run --rm whisper download-ggml-model.sh base /models
    # then run with ASR_PROVIDER=whisper-http and WHISPER_MODEL=ggml-base.bin (default).
    image: ghcr.io/ggml-org/whisper.cpp:main
    profiles: ['whisper']
    command:
      [
        'whisper-server',
        '--host',
        '0.0.0.0',
        '--port',
        '8080',
        '-m',
        '/models/${WHISPER_MODEL:-ggml-base.bin}',
        '-t',
        '${WHISPER_THREADS:-4}',
      ]
    networks: [backend]
    volumes:
      - whisper-models:/models
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3000'
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
    # No host port on purpose: web is only reachable through the edge. Its /api and /media rewrites still
    # work (used by `next dev`), but the edge routes those paths to the api before they reach web.
    networks: [edge]
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    depends_on:
      api:
        condition: service_healthy

  edge:
    # The one origin browsers use. Caddy sets X-Forwarded-For to the peer it accepted the connection
    # from and ignores whatever the client sent (its trusted_proxies list is empty): infra/docker/caddy.
    image: caddy:2.11.7
    environment:
      EDGE_SITE_ADDRESS: ${EDGE_SITE_ADDRESS:-:3000}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    networks:
      edge:
        ipv4_address: *edge-address
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # The image runs as root so it can bind 80/443 when EDGE_SITE_ADDRESS names a public site; it keeps
    # only that capability.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    healthcheck:
      # BusyBox wget (Alpine image) treats a 2xx/3xx from web as success.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/']
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  # Only edge, web and api. The subnet is fixed so the edge can have the static address the api trusts.
  # Dynamic addresses (web, api) come from the lower half, the edge sits outside it, and the gateway is fixed
  # too: Docker would otherwise pick one, and it is the source address of host-published-port traffic, which
  # must never be trusted.
  edge:
    ipam:
      config:
        - subnet: *edge-subnet
          ip_range: *edge-ip-range
          gateway: *edge-gateway
  backend:

volumes:
  postgres-data:
  storage-data:
  whisper-models:
  caddy-data:
  caddy-config:
