# Development and evaluation stack. Not hardened for production; see infra/helm for Kubernetes.
# Usage: docker compose -f infra/docker/docker-compose.yml up
name: our-stream

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ourstream_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ourstream-dev-only}
      POSTGRES_DB: ourstream
    command:
      [
        'postgres',
        '-c',
        'shared_preload_libraries=pg_stat_statements',
        '-c',
        'log_min_duration_statement=500',
      ]
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ourstream_admin -d ourstream']
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    # SeaweedFS all-in-one with the S3 gateway (Apache-2.0). MinIO community was archived 2026-04.
    image: chrislusf/seaweedfs:3.97
    command:
      [
        'server',
        '-s3',
        '-s3.port=8333',
        '-dir=/data',
        '-master.volumeSizeLimitMB=1024',
        '-s3.config=/etc/seaweedfs/s3.json',
      ]
    ports:
      - '${S3_PORT:-8333}:8333'
    volumes:
      - storage-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # BusyBox wget exits 1 on any HTTP error, so key on the status line: the S3 root answers 403 to anonymous requests.
      test:
        ['CMD-SHELL', 'wget -S -q -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q "HTTP/1.1 "']
      interval: 5s
      timeout: 3s
      retries: 30

  mailcatcher:
    # Local SMTP sink so magic links and invites work without real SMTP (risk R34).
    image: axllent/mailpit:v1.28
    ports:
      - '${MAILPIT_PORT:-8025}:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ['node', 'dist/cli.js', 'migrate']
    environment: &app-env
      NODE_ENV: development
      DATABASE_URL: postgres://ourstream_app:${APP_DB_PASSWORD:-ourstream-app-dev-only}@postgres:5432/ourstream
      DATABASE_ADMIN_URL: postgres://ourstream_admin:${POSTGRES_PASSWORD:-ourstream-dev-only}@postgres:5432/ourstream
      DATABASE_PLATFORM_URL: postgres://ourstream_platform:${PLATFORM_DB_PASSWORD:-ourstream-platform-dev-only}@postgres:5432/ourstream
      S3_ENDPOINT: http://storage:8333
      S3_REGION: us-east-1
      S3_BUCKET: ourstream
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ourstream-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ourstream-dev-secret-only}
      S3_FORCE_PATH_STYLE: 'true'
      SMTP_URL: smtp://mailcatcher:1025
      APP_BASE_URL: http://localhost:${WEB_PORT:-3000}
      API_BASE_URL: http://localhost:${API_PORT:-4000}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789}
      MEDIA_HMAC_SECRET: ${MEDIA_HMAC_SECRET:-dev-only-media-secret-change-me-0123456789}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      <<: *app-env
      PORT: '4000'
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:4000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3000'
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  storage-data:
