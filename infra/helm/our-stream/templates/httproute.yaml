{{- if .Values.gatewayApi.enabled }}
# Gateway API alternative to the Ingress pair: one HTTPRoute with a standard URLRewrite for /api, so no
# controller-specific annotation is needed. Requires gateway.networking.k8s.io/v1 in the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "our-stream.fullname" . }}
  labels:
    {{- include "our-stream.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayApi.parentRefs | nindent 4 }}
  hostnames:
    {{- range .Values.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: / }
      backendRefs:
        - name: {{ include "our-stream.apiServiceName" . }}
          port: {{ .Values.api.service.port }}
    - matches:
        - path: { type: PathPrefix, value: /media }
      backendRefs:
        - name: {{ include "our-stream.apiServiceName" . }}
          port: {{ .Values.api.service.port }}
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "our-stream.fullname" . }}-web
          port: {{ .Values.web.service.port }}
{{- end }}
