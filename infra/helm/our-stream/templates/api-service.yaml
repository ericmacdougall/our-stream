apiVersion: v1
kind: Service
metadata:
  name: {{ include "our-stream.apiServiceName" . }}
  labels:
    {{- include "our-stream.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "our-stream.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
