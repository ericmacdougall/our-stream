apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "our-stream.fullname" . }}-api
  labels:
    {{- include "our-stream.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "our-stream.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "our-stream.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "our-stream.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "our-stream.image" (dict "root" . "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '4000'
            - name: HOST
              value: 0.0.0.0
            - name: APP_BASE_URL
              value: {{ .Values.appBaseUrl | quote }}
            - name: S3_CORS_ORIGINS
              value: {{ include "our-stream.s3CorsOrigins" . | quote }}
            {{- include "our-stream.objectStorageEnv" . | nindent 12 }}
            {{- with .Values.objectStorage.publicEndpoint }}
            - name: S3_PUBLIC_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: MAIL_FROM
              value: {{ .Values.mail.from | quote }}
            - name: TRUST_PROXY
              value: {{ include "our-stream.trustProxy" . | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.api.logLevel | quote }}
            - name: GIT_COMMIT
              value: {{ .Chart.AppVersion | quote }}
            {{- include "our-stream.extraEnv" .Values.api.env | nindent 12 }}
            # Credentials by key, so the api sees exactly these and nothing else that the Secret may hold
            # (never the admin URL, never the platform role).
            {{- include "our-stream.secretEnv" (dict "secret" .Values.secrets.app.existingSecret "keys" (list "DATABASE_URL" "S3_ACCESS_KEY" "S3_SECRET_KEY" "SESSION_SECRET" "MEDIA_HMAC_SECRET") "optional" (list "SMTP_URL")) | nindent 12 }}
          # Readiness depends on the database (/health runs SELECT 1); liveness must not, or a database
          # outage would restart every api pod.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
