# Failing control for ci/assert-rendered.py: one Deployment that breaks every invariant (privileged, host
# network, root, admin URL in the api, TRUST_PROXY=true, envFrom, a compose development secret) and no Job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-api
  labels:
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels: { app: bad-api }
  template:
    metadata:
      labels: { app: bad-api }
    spec:
      hostNetwork: true
      containers:
        - name: api
          image: example.invalid/api:0
          securityContext:
            privileged: true
          envFrom:
            - secretRef: { name: everything }
          env:
            - name: TRUST_PROXY
              value: 'true'
            - name: DATABASE_ADMIN_URL
              value: postgres://example.invalid/not-a-real-credential
            - name: SESSION_SECRET
              value: dev-only-session-secret-change-me-0123456789
