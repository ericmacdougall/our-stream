# SPDX-License-Identifier: AGPL-3.0-only
# A parser sandbox rendering that weakens every protection: more than one replica, a ServiceAccount token, a
# Secret in the environment, a writable root, no memory limit, extra volumes, a policy that allows traffic and
# another workload mounting the job claim. ci/check.sh asserts that assert-rendered.py names each reason.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-parser
  labels:
    app.kubernetes.io/component: parser
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: parser
  template:
    metadata:
      labels:
        app.kubernetes.io/component: parser
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: parser
          image: example/parser:1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_PLATFORM_URL
              valueFrom:
                secretKeyRef:
                  name: app
                  key: DATABASE_PLATFORM_URL
          volumeMounts:
            - name: io
              mountPath: /everything
            - name: host
              mountPath: /host
      volumes:
        - name: io
          persistentVolumeClaim:
            claimName: bad-io
        - name: host
          hostPath:
            path: /
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-snooper
  labels:
    app.kubernetes.io/component: web
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: example/web:1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: stolen
          persistentVolumeClaim:
            claimName: bad-io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bad-parser-allow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: parser
  policyTypes: [Ingress, Egress]
  egress:
    - {}
